<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form id="filterForm" action="" method="">
    <!-- 1. Точное совпадение (один отдел) -->
    <div>
      <label for="department">Отдел (точное совпадение):</label>
      <select name="department" id="department">
        <option value="">-- Все отделы --</option>
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Marketing">Marketing</option>
        <option value="Finance">Finance</option>
      </select>
    </div>

    <!-- 2. Массив отделов (фильтр "ИЛИ": IN ('IT', 'HR')) -->
    <fieldset>
      <legend>Отделы (множественный выбор):</legend>
      <label><input type="checkbox" name="departments[]" value="IT"> IT</label>
      <label><input type="checkbox" name="departments[]" value="HR"> HR</label>
      <label><input type="checkbox" name="departments[]" value="Sales"> Sales</label>
      <label><input type="checkbox" name="departments[]" value="Marketing">Marketing</label>
      <label><input type="checkbox" name="departments[]" value="Finance">Finance</label>
    </fieldset>

    <!-- 3. Диапазон зарплат -->
    <div>
      <label>Зарплата:</label>
      <input type="number" name="min_salary" placeholder="От" min="0" step="1000">
      <input type="number" name="max_salary" placeholder="До" min="0" step="1000">
    </div>

    <!-- 4. Диапазон дат найма -->
    <div>
      <label>Дата найма:</label>
      <input type="date" name="hire_from">
      <span>—</span>
      <input type="date" name="hire_to">
    </div>

    <!-- 5. Статус активности ("1" / "0") -->
    <div>
      <label for="is_active">Статус:</label>
      <select name="is_active" id="is_active">
        <option value="">Все</option>
        <option value="1">Только активные</option>
        <option value="0">Только уволенные</option>
      </select>
    </div>

    <!-- 6. Поиск по имени или фамилии -->
    <div>
      <label for="search">Поиск (имя/фамилия):</label>
      <input type="text" name="search" id="search" placeholder="Иван или Иванов">
    </div>

    <!-- 7. Сортировка и направление -->
    <div>
      <label for="sort_by">Сортировать по:</label>
      <select name="sort_by" id="sort_by">
        <option value="hire_date" selected>Дате найма</option>
        <option value="salary">Зарплате</option>
        <option value="last_name">Фамилии</option>
      </select>

      <select name="order" id="order">
        <option value="desc">По убыванию (DESC)</option>
        <option value="asc">По возрастанию (ASC)</option>
      </select>
    </div>

    <!-- 8. Пагинация -->
    <div>
      <label for="page">Страница:</label>
      <input type="number" name="page" id="page" value="1" min="1">

      <label for="per_page">На странице:</label>
      <select name="per_page" id="per_page">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
    </div>

    <button type="submit">Применить</button>
    <a href="/employees">Сбросить</a>
  </form>

  <script src="script.js"></script>
</body>
</html>
