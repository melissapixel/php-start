<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Remember me</title>
</head>
<body>
  <form class="name-form" id="nameForm">
    <input type="text" id="nameInput" placeholder="Ваше имя" required>
    <button type="submit">Запомнить</button>
  </form>

  <div id="greeting-section" class="hidden">
    <span id="greeting-text" style="font-size: 20px; font-weight: bold;"></span>
    <button id="forget-btn">Забыть меня</button>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
