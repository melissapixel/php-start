<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сотрудники — фильтр по контактам</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .filter-form {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .filter-form h2 {
      margin-top: 0;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
    }

    .radio-group label {
      cursor: pointer;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    .empty {
      color: #999;
      font-style: italic;
    }

    .message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
    }

    .error {
      background: #fee;
      color: #c33;
    }
  </style>
</head>
<body>

  <h1>Список сотрудников</h1>

  <form class="filter-form" id="filterForm">
    <h2>Фильтр по контактам</h2>

    <div class="radio-group">
      <label>
        <input type="radio" name="filter" value="all" checked>
        Показать всех
      </label>

      <label>
        <input type="radio" name="filter" value="no_phone">
        Без телефона
      </label>

      <label>
        <input type="radio" name="filter" value="no_email">
        Без email
      </label>

      <label>
        <input type="radio" name="filter" value="no_contact">
        Без телефона и email
      </label>
    </div>

    <button type="submit">Применить фильтр</button>
  </form>

  <div id="message"></div>

  <table id="resultTable" style="display: none;">
    <caption></caption>
    <thead>
      <tr>
        <th>Имя</th>
        <th>Должность</th>
        <th>Телефон</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="resultBody">
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
