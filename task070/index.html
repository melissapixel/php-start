<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
</head>
<body>
  <div class="container">
    <h1>Tasks</h1>

    <form id="task-form">
      <input
        type="text"
        id="task-input"
        name="task"
        placeholder="Новая задача..."
        autocomplete="off"
        required
      />
      <button type="submit" class="add-btn">Add Task</button>
    </form>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
