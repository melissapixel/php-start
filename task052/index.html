<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>SQL: Filtering and sorting</title>
</head>
<body>
  <form action="" method="">
    <!-- Категория (точное совпадение) -->
    <div>
      <label for="category">Категория:</label>
      <input type="text" id="category" name="category" placeholder="Например: electronics">
    </div>

    <!-- Диапазон цен (BETWEEN) -->
    <div>
      <label for="min_price">Цена от:</label>
      <input type="number" id="min_price" name="min_price" min="0" step="any" placeholder="0">

      <label for="max_price">до:</label>
      <input type="number" id="max_price" name="max_price" min="0" step="any" placeholder="10000">
    </div>

    <!-- В наличии (если "1", то stock > 0) -->
    <div>
      <label>
        <input type="checkbox" name="in_stock" value="1">
        Только в наличии
      </label>
    </div>

    <!-- Сортировка (по умолчанию "price") -->
    <div>
      <label for="sort_by">Сортировать по:</label>
      <select id="sort_by" name="sort_by">
        <option value="price" selected>По цене</option>
        <option value="name">По названию</option>
      </select>
    </div>

    <!-- Порядок сортировки (по умолчанию "asc") -->
    <div>
      <label for="order">Порядок:</label>
      <select id="order" name="order">
        <option value="ASC" selected>По возрастанию (ASC)</option>
        <option value="DESC">По убыванию (DESC)</option>
      </select>
    </div>

    <!-- Лимит (по умолчанию 10, максимум 100) -->
    <div>
      <label for="limit">Показывать по:</label>
      <input type="number" id="limit" name="limit" value="10" min="1" max="100">
    </div>

    <div>
      <button type="submit">Применить фильтры</button>
      <button type="reset">Сбросить</button>
    </div>
  </form>

  <p class="result"></p>
  <ul class="products"></ul>

  <script src="script.js"></script>
</body>
</html>
